<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home - Mister Soluções</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/home}">Mister Soluções</a>
        <div class="d-flex align-items-center gap-3">
            <span class="text-white">
                Olá, <strong th:text="${usuarioLogado.nome}">Usuário</strong>
            </span>
            <a class="btn btn-outline-light" th:href="@{/logout}">Sair</a>
        </div>
    </div>
</nav>

<main class="container py-5">
    <div class="mb-5">
        <h1 class="display-6 fw-bold">Inicio</h1>
        <p class="lead mb-0">Escolha uma das opções abaixo para continuar.</p>
    </div>

    <div class="col-12 col-md-6"
         th:if="${usuarioLogado.perfil == 'ADM'}">

        <div class="card h-100 shadow-sm">

            <div class="card-body p-4">

                <h2 class="h4">Cadastro de Produto</h2>

                <p class="text-muted">
                    Cadastre os produtos do sistema.
                </p>

                <a class="btn btn-primary"
                   th:href="@{/produto/cadastro}">
                    Acessar
                </a>

            </div>

        </div>

    </div>

        <div class="col-12 col-md-6">
            <div class="card h-100 shadow-sm">
                <div class="card-body p-4">
                    <h2 class="h4">Gestão de Estoque</h2>
                    <p class="text-muted">Acesse o controle e acompanhamento do estoque.</p>
                    <a class="btn btn-primary" th:href="@{/estoque}">Acessar</a>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
