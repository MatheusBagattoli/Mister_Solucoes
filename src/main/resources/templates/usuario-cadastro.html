<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Usuário - Mister Soluções</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand" href="/home">
            Mister Soluções
        </a>

        <div class="text-white">
            <span th:text="${session.usuarioLogado.nome}"></span>

            <span class="badge bg-warning text-dark"
                  th:text="${session.usuarioLogado.perfil}">
            </span>

            <a href="/logout" class="btn btn-outline-light btn-sm ms-2">
                Sair
            </a>
        </div>

    </div>
</nav>


<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow">

                <div class="card-header bg-dark text-white">
                    <h4 class="mb-0">Cadastro de Colaborador</h4>
                </div>

                <div class="card-body">

                    <!-- Mensagem de sucesso -->
                    <div th:if="${param.sucesso}"
                         class="alert alert-success">
                        Usuário cadastrado com sucesso!
                    </div>

                    <!-- Mensagem de erro -->
                    <div th:if="${param.erro}"
                         class="alert alert-danger">

                        <span th:if="${param.erro[0] == 'cpf'}">
                            CPF já cadastrado!
                        </span>

                        <span th:if="${param.erro[0] != 'cpf'}">
                            Não foi possível cadastrar o usuário.
                        </span>

                    </div>


                    <form action="/usuario/cadastrar"
                          method="post"
                          th:object="${usuario}">

                        <!-- Nome -->
                        <div class="mb-3">

                            <label for="nome"
                                   class="form-label">
                                Nome
                            </label>

                            <input type="text"
                                   id="nome"
                                   th:field="*{nome}"
                                   class="form-control"
                                   placeholder="Digite o nome completo"
                                   required>

                        </div>


                        <!-- Data de nascimento -->
                        <div class="mb-3">

                            <label for="dataNascimento"
                                   class="form-label">
                                Data de nascimento
                            </label>

                            <input type="date"
                                   id="dataNascimento"
                                   th:field="*{dataNascimento}"
                                   class="form-control"
                                   required>

                        </div>


                        <!-- Matrícula -->
                        <div class="mb-3">

                            <label for="matricula"
                                   class="form-label">
                                Matrícula
                            </label>

                            <input type="text"
                                   id="matricula"
                                   th:field="*{matricula}"
                                   class="form-control"
                                   placeholder="Digite a matrícula"
                                   required>

                        </div>


                        <!-- CPF -->
                        <div class="mb-3">

                            <label for="cpf"
                                   class="form-label">
                                CPF
                            </label>

                            <input type="text"
                                   id="cpf"
                                   th:field="*{cpf}"
                                   class="form-control"
                                   placeholder="Digite o CPF"
                                   maxlength="11"
                                   required>

                            <small class="text-muted">
                                Digite apenas os 11 números do CPF.
                            </small>

                        </div>


                        <!-- E-mail -->
                        <div class="mb-3">

                            <label for="email"
                                   class="form-label">
                                E-mail
                            </label>

                            <input type="email"
                                   id="email"
                                   th:field="*{email}"
                                   class="form-control"
                                   placeholder="Digite o e-mail"
                                   required>

                        </div>


                        <!-- Senha -->
                        <div class="mb-3">

                            <label for="senha"
                                   class="form-label">
                                Senha
                            </label>

                            <input type="password"
                                   id="senha"
                                   th:field="*{senha}"
                                   class="form-control"
                                   placeholder="Digite a senha"
                                   required>

                        </div>


                        <!-- Perfil -->
                        <div class="mb-4">

                            <label for="perfil"
                                   class="form-label">
                                Perfil
                            </label>

                            <select id="perfil"
                                    th:field="*{perfil}"
                                    class="form-select"
                                    required>

                                <option value="">
                                    Selecione o perfil
                                </option>

                                <option value="FUNCIONARIO">
                                    Funcionário
                                </option>

                                <option value="ADM">
                                    Administrador
                                </option>

                            </select>

                        </div>


                        <!-- Botões -->
                        <div class="d-flex justify-content-between">

                            <a href="/home"
                               class="btn btn-secondary">
                                Voltar
                            </a>

                            <button type="submit"
                                    class="btn btn-success">
                                Cadastrar
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
